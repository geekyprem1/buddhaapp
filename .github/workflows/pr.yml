name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test (packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Generate code (freezed/json_serializable/riverpod)
        run: dart pub global run melos exec --depends-on=build_runner -- "dart run build_runner build --delete-conflicting-outputs"

      - name: Analyze all packages
        run: dart pub global run melos exec -- "dart analyze ."

      - name: Format check
        run: dart format --set-exit-if-changed packages apps 2>$null || true

      - name: Test all packages
        run: dart pub global run melos exec --dir-exists=test -- "flutter test"

  build-mobile:
    name: Build debug APK (dev flavour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Generate localisation
        working-directory: apps/mobile
        run: flutter gen-l10n

      - name: Build dev debug APK
        working-directory: apps/mobile
        run: flutter build apk --flavor dev -t lib/main_dev.dart --debug

  build-admin:
    name: Build admin web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Generate code
        run: dart pub global activate melos ; dart pub global run melos exec --depends-on=build_runner -- "dart run build_runner build --delete-conflicting-outputs"

      - name: Build admin web (dev)
        working-directory: apps/admin
        run: flutter build web -t lib/main_dev.dart --release

  rules-tests:
    name: Firestore Security Rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI and test deps
        run: |
          npm install -g firebase-tools
          npm --prefix firebase/tests ci

      - name: Run rules unit tests
        run: firebase emulators:exec --only firestore "npm --prefix firebase/tests test"
