flutter_native_splash:
  # Native OS splash shown until the Flutter engine draws its first frame.
  # Cream brand background with the Dhamma Path logo centered.
  color: "#FDF3E0"
  image: assets/branding/app_icon.png

  # Dark theme keeps the same cream lockup (brand stays warm in the dark).
  color_dark: "#FDF3E0"
  image_dark: assets/branding/app_icon.png

  android_12:
    # Android 12+ uses a system-driven splash: colored background + a
    # centered icon. Keep the same brand cream + logo.
    color: "#FDF3E0"
    image: assets/branding/app_icon.png
    color_dark: "#FDF3E0"
    image_dark: assets/branding/app_icon.png

  android: true
  ios: true
  web: false
