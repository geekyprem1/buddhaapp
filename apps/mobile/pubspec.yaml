name: dhamma_path
description: "Dhamma Path — Buddhist devotional content app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.7
  firebase_app_check: ^0.3.1+8
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  # firebase_crashlytics temporarily removed: on AGP 9 / Android 16 the
  # Crashlytics native component failed to register and broke
  # Firebase.initializeApp on release builds. Re-add with a compatible SDK
  # before launch (TASKS T2.73 follow-up).
  firebase_remote_config: ^5.3.0
  cloud_functions: ^5.2.0
  google_sign_in: ^7.1.0

  # State + routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # Local cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Media
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  connectivity_plus: ^6.1.4

  # Localisation
  intl: ^0.20.0

  # Utilities
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo.png
    - assets/branding/app_icon.png
