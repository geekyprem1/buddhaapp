flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: false
  remove_alpha_ios: true
  # Adaptive icon (Android 8+): logo on the app's cream brand background.
  adaptive_icon_background: "#FDF3E0"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
