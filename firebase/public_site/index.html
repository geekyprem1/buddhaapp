<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dhamma Path</title>
    <style>
      :root {
        --cream: #fdf3e0;
        --maroon: #8b1a1a;
        --gold: #d4a24c;
        --ink: #1f1f1f;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--cream);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }
      .rule {
        height: 1px;
        background: var(--gold);
        border: 0;
      }
      p.eyebrow {
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 0.75rem;
        color: var(--maroon);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-weight: 600;
        font-size: 2.4rem;
        margin: 0 0 1rem;
      }
      a {
        color: var(--maroon);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Dhamma Path</p>
      <h1>Power in Every Voice</h1>
      <hr class="rule" />
      <p>
        Buddhist wallpapers, songs, meditations and daily prarthana. Privacy
        Policy, Terms and the supporter ID verifier will be published here
        before launch.
      </p>
      <p><a href="https://admin.dhammapath.app">Admin desk</a></p>
    </main>
  </body>
</html>
