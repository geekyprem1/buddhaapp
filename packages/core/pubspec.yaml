name: core
description: "Shared domain layer for Dhamma Path: models, repositories, services, validators, constants."
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.19.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Data layer
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3
  firebase_storage: ^12.3.7
  firebase_core: ^3.8.0
  cloud_functions: ^5.2.0

  # State management (providers live in core so app + admin share them)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  equatable: ^2.0.7
  collection: ^1.19.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1
  mocktail: ^1.0.4
